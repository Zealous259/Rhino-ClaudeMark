<body class="boot">

      <feGaussianBlur in="n" stdDeviation="2.5" result="nb"/>

    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16.5v-5M12 16.5v-10M17 16.5v-7.5"/></symbol>
    <symbol id="i-crit" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 01-11.2 6.5L4 19.5l1.5-4.3A7.5 7.5 0 1120 11.5z"/><path d="M12 8v4.2"/><path d="M12 15.1h.01" stroke-width="2.4"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M11 3.5l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z"/><path d="M18 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>

<div id="backdrop"></div>
<div id="backdrop-tint"></div>
<canvas id="canvas" tabindex="0" aria-label="Capture: draw your marks here"></canvas>

<!-- top left: tasks panel, the document -->
<div class="cluster tl chrome">
  <div class="glass round"><button class="btn" id="sidebar-btn" data-tip="Task and presets" data-sub="What kind of job this is, and how you like it done"><svg class="ic"><use href="#i-sidebar"/></svg></button></div>
  <div class="glass capsule" id="doc-info"></div>
</div>

<!-- top centre: tools -->
<div class="glass capsule chrome" id="toolbar">
  <div class="seg" id="tools"><div class="seg-thumb" id="tool-thumb"></div></div>
  <div class="sep" id="sep-a"></div>
  <div class="swatches" id="swatches"></div>
  <button class="btn colour-pick hidden" id="colour-pick" data-tip="Colour" data-key="1-7"><i style="display:block;width:18px;height:18px;border-radius:50%;background:var(--c)"></i></button>
  <div class="sep" id="sep-b"></div>
  <div class="seg widths" id="widths"><div class="seg-thumb" id="width-thumb"></div></div>
  <button class="btn width-pick hidden" id="width-pick" data-tip="Line width" data-key="[ ]"><span class="wline" style="height:3.5px"></span></button>
  <div class="sep"></div>
  <button class="btn" id="undo-btn" data-tip="Undo" data-key="Ctrl+Z"><svg class="ic"><use href="#i-undo"/></svg></button>
  <button class="btn" id="redo-btn" data-tip="Redo" data-key="Ctrl+Y"><svg class="ic"><use href="#i-redo"/></svg></button>
</div>

<!-- top right -->
<div class="cluster tr chrome">
  <div class="glass capsule tr-group">
    <button class="btn" id="zoom-btn" data-tip="Zoom" data-sub="Ctrl+scroll or pinch to zoom, Space+drag to pan. Click to fit." data-key="Ctrl+0">Fit</button>
    <button class="btn" id="inspect-btn" data-tip="Show what is under the cursor" data-sub="Rhino's pick under the pointer: the object, its name and layer"><svg class="ic"><use href="#i-target"/></svg></button>
    <button class="btn" id="marks-btn" data-tip="Marks" data-sub="Every mark, its number, what it hits and your comment"><svg class="ic"><use href="#i-list"/></svg><span class="badge" id="marks-badge"></span></button>
    <button class="btn" id="settings-btn" data-tip="Settings"><svg class="ic"><use href="#i-sliders"/></svg></button>
    <button class="btn" id="help-btn" data-tip="Shortcuts and help" data-key="?"><svg class="ic"><use href="#i-help"/></svg></button>
  </div>
</div>

<aside class="glass panel closed chrome" id="sidebar">
  <div class="panel-head"><h2>Task</h2><button class="btn" id="sidebar-close" data-tip="Close"><svg class="ic s16"><use href="#i-x"/></svg></button></div>
  <div class="panel-body" id="sidebar-body"></div>
</aside>

<aside class="glass panel closed chrome" id="marks-panel">
  <div class="panel-head"><h2>Marks <span class="count" id="marks-count"></span></h2><button class="btn" id="marks-close" data-tip="Close"><svg class="ic s16"><use href="#i-x"/></svg></button></div>
  <div class="panel-body" id="marks-body"></div>
</aside>

<div id="banners"></div>

<footer class="glass chrome" id="composer">
  <div id="chips"></div>
  <div class="crow">
    <button class="btn" id="attach-btn" data-tip="Add an image" data-sub="Reference images, pasted or dropped onto the spot they apply to"><svg class="ic"><use href="#i-plus"/></svg></button>
    <textarea id="note" rows="1" spellcheck="true" placeholder="Ask Claude about this view"></textarea>
    <button class="btn" id="target-btn" data-tip="Where the request goes" data-sub="The Claude Code window that receives the image and your text"></button>
    <button class="btn" id="queue-btn" data-tip="Add to batch" data-sub="Keep this capture and mark another view. Send pastes them all together." data-key="Ctrl+Shift+Enter"><svg class="ic"><use href="#i-stack"/></svg><span class="badge" id="queue-badge"></span></button>
    <button class="btn" id="send-btn" data-tip="Send to Claude" data-key="Enter"><svg class="ic"><use href="#i-send"/></svg><span class="badge" id="send-badge"></span></button>
  </div>
</footer>

<div id="toasts"></div>
<div id="hover-tag" class="glass"><div class="h1"></div><div class="h2"></div></div>
<textarea id="text-editor" class="hidden" spellcheck="false"></textarea>
<div id="layer"></div>
<div id="tooltip" class="glass"></div>
<div id="drop-overlay"><div class="glass card-drop"><svg class="ic"><use href="#i-image"/></svg><span id="drop-text">Drop to add a reference</span></div></div>
<div id="drop-ring"></div>

<script>
  (function () {
    var v = window.CM_VERSION;
    if (/[?&]mock=/.test(location.search)) document.write('<script src="mock.js?v=' + v + '"><\/script>');
    document.write('<script src="app.js?v=' + v + '"><\/script>');
  })();
</script>
</body>
</html>
